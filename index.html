<style>
/* Layout: página blanca estilo Apple. Cada sección es una ventana de Mac; el hero es la única ventana oscura.
   Barra de menú translúcida, fuente del sistema para la interfaz y serif para leer las entradas. */
:root {
  --page: #FFFFFF;
  --win: #FFFFFF;
  --win-bar: #F5F5F7;
  --line: #E3E3E6;
  --ink: #1D1D1F;
  --muted: #6E6E73;
  --accent: #0071E3;
  --hero: #1D1D1F;
  --hero-bar: #2A2A2D;
  --hero-ink: #F5F5F7;
  --hero-muted: #A1A1A6;
  --hero-line: #3A3A3D;
  --hi: #FFE169;
  --hi-ink: #2B2300;
  --ok: #1D7D45;
  --ok-soft: #E4F4EA;
  --draft: #B44D00;
  --draft-soft: #FFF0E1;
  --pending-soft: #F0F0F2;
  --bubble-me: #0A84FF;
  --bubble-them: #E9E9EB;
  --glass: rgba(255, 255, 255, .72);
  --shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 2px 6px rgba(0, 0, 0, .04), 0 24px 60px -24px rgba(0, 0, 0, .22);
  --shadow-hero: 0 0 0 1px rgba(0, 0, 0, .2), 0 30px 70px -28px rgba(0, 0, 0, .55);

  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --read: "Source Serif 4", "New York", Georgia, serif;
  --mono: "SF Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --ease-out: cubic-bezier(.23, 1, .32, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #000000; --win: #1C1C1E; --win-bar: #242426; --line: #38383A; --ink: #F5F5F7; --muted: #98989D;
    --accent: #2997FF; --hero: #2C2C2E; --hero-bar: #343437; --hero-line: #48484A;
    --hi: #E9C84A; --hi-ink: #231C00; --ok: #30D158; --ok-soft: #10291A; --draft: #FF9F0A; --draft-soft: #33230A;
    --pending-soft: #2C2C2E; --bubble-them: #2C2C2E; --glass: rgba(22, 22, 24, .72);
    --shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 24px 60px -24px rgba(0, 0, 0, .9);
    --shadow-hero: 0 0 0 1px rgba(255, 255, 255, .1), 0 30px 70px -28px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #000000; --win: #1C1C1E; --win-bar: #242426; --line: #38383A; --ink: #F5F5F7; --muted: #98989D;
  --accent: #2997FF; --hero: #2C2C2E; --hero-bar: #343437; --hero-line: #48484A;
  --hi: #E9C84A; --hi-ink: #231C00; --ok: #30D158; --ok-soft: #10291A; --draft: #FF9F0A; --draft-soft: #33230A;
  --pending-soft: #2C2C2E; --bubble-them: #2C2C2E; --glass: rgba(22, 22, 24, .72);
  --shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 24px 60px -24px rgba(0, 0, 0, .9);
  --shadow-hero: 0 0 0 1px rgba(255, 255, 255, .1), 0 30px 70px -28px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--page); color: var(--ink);
  font: 400 1rem/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--page);
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
a { color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 8px; }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Barra de menú translúcida */
.menubar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 1px 0 color-mix(in srgb, var(--line) 70%, transparent);
}
.menubar .wrap { display: flex; align-items: center; gap: 22px; padding-block: 10px; font-size: .8125rem; }
.brand { font-weight: 700; text-decoration: none; letter-spacing: -.01em; }
.menubar nav { display: flex; gap: 18px; }
.menubar nav a { text-decoration: none; color: var(--muted); transition: color .15s ease; }
.menubar .right { margin-left: auto; display: flex; gap: 14px; align-items: center; color: var(--muted); }
@media (hover: hover) and (pointer: fine) { .menubar nav a:hover { color: var(--ink); } }

/* Ventanas */
main.wrap { display: grid; gap: 28px; padding-block: 32px 56px; }
.win {
  background: var(--win); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; min-width: 0;
  animation: enter .36s var(--ease-out) both;
}
.win:nth-of-type(2) { animation-delay: .06s; }
.win:nth-of-type(3) { animation-delay: .12s; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
.bar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  padding: 11px 14px; background: var(--win-bar); border-bottom: 1px solid var(--line);
}
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
.lights i:nth-child(1) { background: #FF5F57; }
.lights i:nth-child(2) { background: #FEBC2E; }
.lights i:nth-child(3) { background: #28C840; }
.bar-title { font-size: .8125rem; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-meta { justify-self: end; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 28px; scroll-margin-top: 60px; }
.section-head h2 { font-size: clamp(2.25rem, 6vw, 3.5rem); font-weight: 700; letter-spacing: -.035em; line-height: 1.02; }
.section-head p { margin: 0 0 6px; color: var(--muted); font-size: .9375rem; }

/* Hero: la ventana oscura */
.win.hero { background: var(--hero); box-shadow: var(--shadow-hero); color: var(--hero-ink); }
.hero .bar { background: var(--hero-bar); border-bottom-color: var(--hero-line); }
.hero .bar-title { color: var(--hero-muted); }
.hero-body { display: grid; grid-template-columns: 1.55fr 1fr; gap: 40px; padding: 48px 44px 44px; align-items: center; }
.eyebrow { font: 500 .75rem/1 var(--mono); letter-spacing: .04em; color: var(--hero-muted); }
.hero h1 { font-size: clamp(2.6rem, 7vw, 4.75rem); font-weight: 700; letter-spacing: -.045em; line-height: 1.02; margin-top: 18px; }
.hero h1 .mark { background: var(--hi); color: var(--hi-ink); padding: 0 .12em; border-radius: .12em; white-space: nowrap; }
.hero .lead { color: var(--hero-muted); font-size: 1.125rem; line-height: 1.5; max-width: 44ch; margin: 20px 0 28px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  font: 600 .9375rem/1 var(--ui); text-decoration: none; cursor: pointer; border: 0;
  display: inline-flex; align-items: center; gap: 6px; padding: 13px 20px; border-radius: 999px;
  background: var(--hero-ink); color: var(--hero);
  transition: transform .16s var(--ease-out), background-color .2s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn.ghost { background: rgba(255, 255, 255, .1); color: var(--hero-ink); }
.btn:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .btn.ghost:hover { background: rgba(255, 255, 255, .16); } }
.stats { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--hero-line); }
.stats div { font-size: .8125rem; color: var(--hero-muted); }
.stats b { display: block; font: 700 1.5rem/1.1 var(--display); color: var(--hero-ink); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* Retrato sin fondo: se apoya en el borde inferior de la ventana, con un halo cálido detrás.
   La nota de la palabra del día queda pegada encima, sobre el hombro. */
.me { position: relative; align-self: end; display: grid; justify-items: end; margin: 0 -44px -44px 0; min-width: 0; }
.me::before {
  content: ""; position: absolute; top: 2%; right: -40px; width: 420px; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--hi) 26%, transparent), color-mix(in srgb, var(--hi) 8%, transparent) 60%, transparent);
  pointer-events: none;
}
.me img { position: relative; display: block; width: 100%; max-width: 330px; height: auto; filter: drop-shadow(0 18px 36px rgba(0, 0, 0, .5)); }
.me .note { position: absolute; z-index: 1; left: -88px; bottom: 30px; width: 204px; padding: 18px 18px 16px; }
.me .note .word { font-size: 1.625rem; }
/* Pantallas medianas: el texto ocupa todo el ancho y debajo van la nota y el retrato lado a lado */
@media (max-width: 1040px) {
  .hero-body { grid-template-columns: 1fr; gap: 28px; }
  .me { grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 36px; }
  .me::before { right: -50px; width: 400px; top: 0; }
  .me img { max-width: 300px; }
  .me .note { position: relative; left: auto; bottom: auto; width: 100%; max-width: 300px; justify-self: end; align-self: center; padding: 22px 22px 20px; }
  .me .note .word { font-size: 2rem; }
}
.note {
  background: var(--hi); color: var(--hi-ink); padding: 22px 22px 20px; border-radius: 6px;
  transform: rotate(2.5deg); box-shadow: 0 18px 30px -14px rgba(0, 0, 0, .6);
  transition: transform .3s var(--ease-out);
}
@media (hover: hover) and (pointer: fine) { .note:hover { transform: rotate(0deg); } }
.note small { font: 600 .6875rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.note .word { font: 700 2rem/1.05 var(--display); letter-spacing: -.03em; margin: 10px 0 4px; }
.note .pos { font: .75rem/1 var(--mono); opacity: .7; }
.note p { font: 1rem/1.45 var(--read); margin: 12px 0 0; }
.note a { display: inline-block; margin-top: 14px; font-size: .8125rem; font-weight: 600; text-decoration: none; }

/* Entradas: una mini Mac con el Finder abierto. Siempre oscura, con bisel, notch y base de portátil.
   Barra lateral flotante; las carpetas son las guías y los archivos, las evidencias.
   En íconos la carpeta se abre; en lista se despliega con su flechita. */
.mac {
  --fd-bg: #1E1E20; --fd-side: #151517; --fd-ctrl: #2A2A2D; --fd-line: rgba(255, 255, 255, .08);
  --fd-ink: #F2F2F4; --fd-muted: #8E8E93; --fd-hover: rgba(255, 255, 255, .06); --fd-sel: rgba(255, 255, 255, .11);
  --fd-off: #5A5A5E;
  position: relative; padding: 10px; margin-bottom: 14px; border-radius: 26px; background: #0A0A0B;
  box-shadow: inset 0 0 0 1.5px #2C2C2E, 0 40px 80px -36px rgba(0, 0, 0, .55);
  animation: enter .36s var(--ease-out) .06s both;
}
/* La base del portátil, con la muesca para abrir la tapa */
.mac::after {
  content: ""; position: absolute; left: -14px; right: -14px; bottom: -14px; height: 14px;
  border-radius: 2px 2px 18px 18px / 2px 2px 12px 12px;
  background: radial-gradient(64px 7px at 50% 0, rgba(0, 0, 0, .2), transparent), linear-gradient(#E8E8EB, #ABABB0);
  box-shadow: 0 12px 20px -10px rgba(0, 0, 0, .4);
}
:root[data-theme="dark"] .mac::after { background: radial-gradient(64px 7px at 50% 0, rgba(0, 0, 0, .45), transparent), linear-gradient(#4C4C50, #2A2A2C); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .mac::after { background: radial-gradient(64px 7px at 50% 0, rgba(0, 0, 0, .45), transparent), linear-gradient(#4C4C50, #2A2A2C); }
}
.notch {
  position: absolute; top: 0; left: 50%; z-index: 2; width: 130px; height: 22px; margin-left: -65px;
  border-radius: 0 0 12px 12px; background: #0A0A0B;
}
.notch::after {
  content: ""; position: absolute; top: 7px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #3A4660, #10141C 70%);
}
.finder {
  display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 540px;
  border-radius: 17px; overflow: hidden; background: var(--fd-bg); color: var(--fd-ink);
}

/* Barra lateral */
.fd-side { margin: 8px; padding: 14px 10px; border-radius: 12px; background: var(--fd-side); box-shadow: 0 0 0 1px var(--fd-line); }
.fd-side .lights { padding: 0 6px 6px; }
.fd-sec { font: 600 .6875rem/1 var(--ui); color: var(--fd-muted); padding: 16px 8px 6px; }
.fd-link {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px; border: 0; border-radius: 7px;
  background: none; color: var(--fd-ink); font: 500 .8125rem/1.2 var(--ui); text-align: left; cursor: pointer;
  white-space: nowrap; -webkit-tap-highlight-color: transparent; transition: background-color .15s ease;
}
.fd-link svg { width: 16px; height: 16px; flex: none; color: var(--fd-muted); }
.fd-link .dot { width: 10px; height: 10px; margin: 3px; border-radius: 50%; flex: none; }
.fd-link .n { margin-left: auto; color: var(--fd-muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
.fd-link[aria-current="true"] { background: var(--fd-sel); }

/* Barra de herramientas */
.fd-main { display: flex; flex-direction: column; min-width: 0; }
.fd-bar { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 10px; }
.fd-pill { display: flex; padding: 3px; border-radius: 999px; background: var(--fd-ctrl); box-shadow: inset 0 0 0 1px var(--fd-line); flex: none; }
.fd-pill button {
  width: 34px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 999px;
  background: none; color: var(--fd-ink); cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color .15s ease, opacity .15s ease;
}
.fd-pill button:active:not(:disabled) { opacity: .55; }
.fd-pill button:disabled { color: var(--fd-off); cursor: default; }
.fd-pill svg { width: 16px; height: 16px; }
.fd-views button[aria-pressed="true"] { background: rgba(255, 255, 255, .14); }
.fd-title { flex: 1; min-width: 0; font: 650 .9375rem/1.2 var(--ui); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fd-search {
  display: flex; align-items: center; gap: 7px; width: 210px; height: 36px; padding: 0 12px; flex: none;
  border-radius: 999px; background: var(--fd-ctrl); box-shadow: inset 0 0 0 1px var(--fd-line); color: var(--fd-muted);
  transition: box-shadow .15s ease;
}
.fd-search svg { width: 15px; height: 15px; flex: none; }
.fd-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--fd-ink); font: 1rem/1 var(--ui); font-size: max(16px, .8125rem); -webkit-appearance: none; appearance: none; }
.fd-search input::placeholder { color: var(--fd-muted); }
.fd-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.fd-search:focus-within { box-shadow: inset 0 0 0 1px var(--fd-line), 0 0 0 3px rgba(41, 151, 255, .45); }

/* Contenido: íconos */
.fd-body { flex: 1; padding: 16px 18px 24px; }
.fd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 14px 6px; align-content: start; }
.fd-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px 12px; min-width: 0;
  border: 0; border-radius: 10px; background: none; color: inherit; font: inherit; text-align: center; text-decoration: none;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color .15s ease, transform .16s var(--ease-out);
}
.fd-item:active { transform: scale(.95); background: var(--fd-sel); }
.fd-icon { height: 70px; display: grid; place-items: end center; margin-bottom: 6px; }
.fold { display: block; width: 84px; height: 66px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .35)); }
.fd-item .doc {
  width: 50px; height: 62px; padding-bottom: 9px; border-radius: 5px 15px 5px 5px; font-size: .6875rem;
  background-image: linear-gradient(225deg, rgba(255, 255, 255, .35) 0 13px, transparent 13px);
  box-shadow: 0 6px 12px -4px rgba(0, 0, 0, .5);
}
.fd-item.pending .doc { opacity: .4; }
.fd-name { max-width: 100%; font: 600 .8125rem/1.3 var(--ui); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fd-sub { font-size: .6875rem; color: var(--fd-muted); font-variant-numeric: tabular-nums; }
.fd-sub.ready { color: #30D158; }
.fd-sub.draft { color: #FF9F0A; }

/* Contenido: lista que se despliega */
.fd-head, .fd-row { display: grid; grid-template-columns: minmax(0, 1fr) 112px 104px; gap: 12px; align-items: center; padding: 0 10px; }
.fd-head { padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--fd-line); color: var(--fd-muted); font: 600 .6875rem/1 var(--ui); }
.fd-row {
  width: 100%; min-height: 36px; border: 0; border-radius: 7px; background: none; color: inherit;
  font: 500 .8125rem/1.2 var(--ui); text-align: left; text-decoration: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: background-color .15s ease;
}
.fd-rows > :nth-child(even) { background: rgba(255, 255, 255, .025); }
.fd-row:active { background: var(--fd-sel) !important; }
.fd-row .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fd-row .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fd-row .cell { color: var(--fd-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fd-row .cell.ready { color: #30D158; }
.fd-row .cell.draft { color: #FF9F0A; }
.chev { width: 12px; height: 12px; flex: none; color: var(--fd-muted); transition: transform .2s var(--ease-out); }
.fd-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.fd-row .fold { width: 22px; height: 17px; filter: none; flex: none; }
.fd-row .doc {
  width: 16px; height: 20px; padding: 0; flex: none; font-size: 0; border-radius: 2px 5px 2px 2px;
  background-image: linear-gradient(225deg, rgba(255, 255, 255, .35) 0 5px, transparent 5px);
}
.fd-row.child .nm { padding-left: 20px; }
.fd-row.pending .doc { opacity: .4; }
.fd-empty { padding: 72px 0; text-align: center; color: var(--fd-muted); font-size: .875rem; }

/* Barra de ruta */
.fd-path { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--fd-line); font-size: .75rem; color: var(--fd-muted); }
.fd-crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap; overflow: hidden; }

/* Reproductor de audio */

}

.fill {

/* Sobre mí: Mensajes */
.chat { padding: 24px 20px 12px; display: grid; gap: 6px; max-width: 620px; margin: 0 auto; }

footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-block: 0 44px; color: var(--muted); font-size: .75rem; }

  .fd-item .fold { width: 72px; height: 57px; }

  .fd-head, .fd-row { grid-template-columns: minmax(0, 1fr) 92px; padding: 0 8px; }

  .pager { grid-template-columns: 1fr; padding: 8px 18px 28px; }

@media (prefers-reduced-motion: reduce) {

<p>Every day I see a lot of information on my phone: videos on TikTok, messages in WhatsApp groups and posts on Facebook. Some of it is true, some of it is half true and some of it is completely false. The problem is that false news usually looks very real, and it travels faster than the truth.</p>
<p>Last month my aunt sent a message to our family group. It said that a famous supermarket was giving free food to everyone who shared the message ten times. A lot of people shared it, but it was a scam. When I looked for the supermarket's official page, there was nothing about it. That is when I understood that <em class="v">critical thinking</em> is not only for school. It is a skill we need every day.</p>
<h2>My four questions</h2>
<p>Now, before I believe or share something, I ask myself four questions. First, who wrote it? If I can't find the <em class="v">source</em>, I don't trust it. Second, is the <em class="v">headline</em> trying to make me angry or scared? Strong emotions are often a sign of <em class="v">misleading</em> content. Third, do other reliable media say the same thing? If only one page has the story, I wait. Fourth, is the information recent? Many people share old photos as if they were new.</p>
<p>I also try to remember that every media outlet has some <em class="v">bias</em>. That doesn't mean everything they say is a lie. It means I should read more than one point of view before I form an opinion.</p>

<p>Being media literate doesn't mean we have to stop using social networks. It means we have to use them more carefully. If we <em class="v">fact-check</em> before we share, we protect our families and our friends. In my opinion, the most important question is not "Is this interesting?" but "Is this true?"</p>`

const FOLD = '<svg class="fold" viewBox="0 0 84 66" aria-hidden="true"><use href="#i-folder"/></svg>';

const FILES = POSTS.flatMap(p => p.items.map((it, i) => ({
  p, it,
  name: (it.title || p.title) + "." + KIND[it.kind].toLowerCase(),
  href: "#" + p.slug + (i ? "/" + i : "")
})));
const FOLDERS = [...new Set(POSTS.map(p => p.guide))].map(g => ({
  id: g.toLowerCase().replace(/[^a-z0-9]+/g, "-"),
  name: g === "New topic" ? "New topics" : g,
  files: FILES.filter(f => f.p.guide === g)
}));

let fdView = "grid";
try { if (localStorage.getItem("fd-view") === "list") fdView = "list"; } catch {}
const fd = { loc: "root", q: "", open: new Set(), back: [], fwd: [] };
const plural = n => n + (n === 1 ? " item" : " items");

function place(loc) {
  if (loc === "all") return { title: "All files", files: FILES };
  const tag = TAGS.find(t => "tag:" + t[0] === loc);
  if (tag) return { title: tag[1], files: FILES.filter(f => tag[2].includes(f.it.kind)) };
  const folder = FOLDERS.find(f => f.id === loc);
  if (folder) return { title: folder.name, files: folder.files, inRoot: true };
  return { title: "Posts", folders: FOLDERS };
}

function renderSide() {
  const link = (loc, icon, label, n) =>
    `<button class="fd-link" type="button" data-loc="${loc}" aria-current="${fd.loc === loc && !fd.q}">${icon}<span>${esc(label)}</span>${n != null ? `<span class="n">${n}</span>` : ""}</button>`;
  $("fd-nav").innerHTML =
    '<div class="fd-sec">Favorites</div>' +
    link("root", SIDE_ICON.root, "Posts") +
    link("all", SIDE_ICON.all, "All files", FILES.length) +
    '<div class="fd-sec">Folders</div>' +
    FOLDERS.map(f => link(f.id, SIDE_ICON.folder, f.name, f.files.length)).join("") +
    '<div class="fd-sec">Tags</div>' +
    TAGS.map(t => link("tag:" + t[0], `<span class="dot" style="background:${t[3]}"></span>`, t[1])).join("");
}

function fileTile(f) {
  return `<a class="fd-item ${f.it.status}" href="${f.href}" title="${esc(f.p.title)}">
    <span class="fd-icon"><span class="doc ${f.it.kind}" aria-hidden="true">${KIND[f.it.kind]}</span></span>
    <span class="fd-name">${esc(f.name)}</span><span class="fd-sub ${f.it.status}">${STATUS[f.it.status]}</span></a>`;
}

function fileRow(f, parent) {
  return `<a class="fd-row ${f.it.status}${parent ? " child" : ""}" href="${f.href}"${parent ? ` data-parent="${parent}"` : ""}>
    <span class="nm"><span class="doc ${f.it.kind}" aria-hidden="true"></span><span>${esc(f.name)}</span></span>
    <span class="cell ${f.it.status}">${STATUS[f.it.status]}</span><span class="cell">${KIND_NAME[f.it.kind]}</span></a>`;
}

const LIST_HEAD = '<div class="fd-head"><span>Name</span><span>Status</span><span>Kind</span></div>';

function renderFinder(dir = 0, opened = null) {
  const q = fd.q.trim().toLowerCase();
  const here = q
    ? { title: `Results for “${fd.q.trim()}”`, files: FILES.filter(f => [f.name, f.p.title, f.p.dek, f.it.code || "", f.it.dek || ""].join(" ").toLowerCase().includes(q)) }
    : place(fd.loc);
  $("fd-title").textContent = here.title;
  $("fd-back").disabled = !fd.back.length;
  $("fd-fwd").disabled = !fd.fwd.length;
  $("fd-views").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === fdView));
  renderSide();

  let html;
  if (here.folders) {
    html = fdView === "grid"
      ? `<div class="fd-grid">${here.folders.map(f => `<button class="fd-item" type="button" data-folder="${f.id}">
          <span class="fd-icon">${FOLD}</span><span class="fd-name">${esc(f.name)}</span><span class="fd-sub">${plural(f.files.length)}</span></button>`).join("")}</div>`
      : `<div class="fd-list">${LIST_HEAD}<div class="fd-rows">${here.folders.map(f => {
          const open = fd.open.has(f.id), ready = f.files.filter(x => x.it.status === "ready").length;
          return `<button class="fd-row" type="button" data-toggle="${f.id}" aria-expanded="${open}">
            <span class="nm">${CHEV}${FOLD}<span>${esc(f.name)}</span></span><span class="cell">${ready} of ${f.files.length} ready</span><span class="cell">Folder</span></button>` +
            (open ? f.files.map(x => fileRow(x, f.id)).join("") : "");
        }).join("")}</div></div>`;
  } else if (!here.files.length) {
    html = `<div class="fd-empty">${q ? "No files match your search." : "This folder is empty."}</div>`;
  } else {
    html = fdView === "grid"
      ? `<div class="fd-grid">${here.files.map(fileTile).join("")}</div>`
      : `<div class="fd-list">${LIST_HEAD}<div class="fd-rows">${here.files.map(f => fileRow(f)).join("")}</div></div>`;
  }
  $("fd-body").innerHTML = html;

  const crumbs = q ? [["", "Search"]] : here.folders ? [["root", "Posts"]] : here.inRoot ? [["root", "Posts"], [fd.loc, here.title]] : [[fd.loc, here.title]];
  $("fd-crumbs").innerHTML = '<span>My English Journey</span><i>›</i>' + crumbs.map(([loc, label], i) =>
    `<button type="button" data-loc="${loc}"${i === crumbs.length - 1 ? ' aria-current="true"' : ""}>${esc(label)}</button>`).join("<i>›</i>");
  $("fd-count").textContent = plural((here.folders || here.files).length);

  if (reduced()) return;
  if (opened) {
    // La carpeta se despliega: sus archivos bajan desde la fila
    $("fd-body").querySelectorAll(`[data-parent="${opened}"]`).forEach((el, i) => el.animate(
      [{ opacity: 0, transform: "translateY(-6px)" }, { opacity: 1, transform: "none" }],
      { duration: 200, delay: i * 25, easing: EASE, fill: "backwards" }));
  } else if (dir) {
    // Entrar a una carpeta acerca; volver aleja
    [...$("fd-body").querySelectorAll(".fd-item, .fd-row")].slice(0, 24).forEach((el, i) => el.animate(
      [{ opacity: 0, transform: dir > 0 ? "scale(.9)" : "scale(1.06)" }, { opacity: 1, transform: "none" }],
      { duration: 240, delay: i * 18, easing: EASE, fill: "backwards" }));
  }
}

function go(loc) {
  if (loc === fd.loc && !fd.q) return;
  fd.back.push(fd.loc); fd.fwd = [];
  fd.loc = loc; fd.q = ""; $("fd-q").value = "";
  renderFinder(loc === "root" ? -1 : 1);
}

// Atrás y adelante, como las flechas del Finder
function step(from, to, dir) {
  if (!from.length) return;
  to.push(fd.loc);
  fd.loc = from.pop(); fd.q = ""; $("fd-q").value = "";
  renderFinder(dir);
}

function readingTime(p) {
  const html = p.items.map(it => it.body || "").join(" ");
  const words = html.replace(/<[^>]+>/g, " ").trim().split(/\s+/).filter(Boolean).length;
  return words > 120 ? Math.max(1, Math.round(words / 180)) + " min read" : "";
}

  const frame = m.vertical ? "frame vertical" : "frame";
  if (m.type === "youtube") {
    const id = encodeURIComponent(m.id);
    return `<div class="media"><div class="${frame}"><iframe src="https://www.youtube-nocookie.com/embed/${id}?playsinline=1&rel=0" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div></div>`;
  }
  if (m.type === "video") return `<div class="media"><div class="${frame}"><video controls playsinline preload="metadata" src="${esc(m.src)}" title="${esc(title)}"></video></div></div>`;
  if (m.type === "audio") return `
    <div class="media"><div class="player">
      <audio preload="metadata" src="${esc(m.src)}"></audio>
      <button class="play" type="button" aria-label="Play ${esc(title)}">${ICONS.play}${ICONS.pause}</button>
      <div class="track" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00"><div class="fill"></div></div>
      <span class="time">0:00</span>
    </div></div>`;
  if (m.type === "image") return `<figure class="media"><a class="sheet" href="${esc(m.pdf || m.src)}" target="_blank" rel="noopener"><img src="${esc(m.src)}" alt="${esc(m.alt || title)}" width="${m.width || ""}" height="${m.height || ""}" loading="lazy" decoding="async"></a>${m.pdf ? `<figcaption><a class="out" href="${esc(m.pdf)}" target="_blank" rel="noopener">Open the PDF ›</a></figcaption>` : ""}</figure>`;
  if (m.type === "link") return `<div class="media"><div class="slot"><b>${esc(m.label || "Open the file")}</b><a class="out" href="${esc(m.url)}" target="_blank" rel="noopener">Open ›</a></div></div>`;
  return "";
}

function itemHTML(p, it) {
  // Una entrada nueva tiene un solo texto sin código: se muestra sin encabezado propio
  if (!it.code) return `${mediaHTML(it, p.title)}${it.body ? `<div class="body">${it.body}</div>` : ""}`;
  return `
    <section class="evidence">
      <div class="ev-head">
        <span class="doc ${it.kind}" aria-hidden="true">${KIND[it.kind]}</span>
        <div>
          <div class="ev-meta"><span class="ev-code">${esc(it.code)}</span><span class="pill ${it.status}">${STATUS[it.status]}</span></div>
          <h2>${esc(it.title)}</h2>
        </div>
      </div>
      ${it.dek ? `<p class="ev-dek">${esc(it.dek)}</p>` : ""}
      ${mediaHTML(it, it.title)}
      ${it.body ? `<div class="body">${it.body}</div>` : ""}
      ${it.pdf ? `<a class="out" href="${esc(it.pdf)}" target="_blank" rel="noopener">Open the original PDF ›</a>` : ""}
    </section>`;
}

function renderPost(p) {
  const i = POSTS.indexOf(p);
  $("reader-file").textContent = p.items.length > 1 ? p.slug + "/" : p.slug + "." + KIND[p.items[0].kind].toLowerCase();
  $("reader-pos").textContent = (i + 1) + " of " + POSTS.length;
  const rt = readingTime(p);
  $("post").innerHTML = `
    <div class="tags"><span class="tag">${esc(p.guide)}</span><span class="tag">${p.items.length > 1 ? p.items.length + " evidences" : KIND[p.items[0].kind]}</span>${rt ? `<span class="tag">${rt}</span>` : ""}</div>
    <h1>${esc(p.title)}</h1>
    <p class="dek">${esc(p.dek)}</p>
    ${p.items.map(it => itemHTML(p, it)).join("")}
    ${p.vocab.length ? `<section class="vocab"><h2>Key vocabulary</h2><dl>${p.vocab.map(([w, d]) => `<dt>${esc(w)}</dt><dd>${esc(d)}</dd>`).join("")}</dl></section>` : ""}`;
  const prev = POSTS[i - 1], next = POSTS[i + 1];
  $("pager").innerHTML =
    (prev ? `<a href="#${prev.slug}"><small>‹ Previous</small><span>${esc(prev.title)}</span></a>` : "") +
    (next ? `<a class="next" href="#${next.slug}"><small>Next ›</small><span>${esc(next.title)}</span></a>` : "");
  $("post").querySelectorAll(".player").forEach(setupPlayer);
}

const clock = s => !isFinite(s) ? "0:00" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

// Reproductor propio: play/pausa, barra que se arrastra 1:1 con el dedo y flechas del teclado
function setupPlayer(root) {
  const audio = root.querySelector("audio"), btn = root.querySelector(".play");
  const track = root.querySelector(".track"), fill = root.querySelector(".fill"), time = root.querySelector(".time");
  let raf = 0, dragging = false;

  const paint = t => {
    const d = audio.duration || 0;
    fill.style.transform = `scaleX(${d ? Math.min(1, t / d) : 0})`;
    time.textContent = audio.paused && t === 0 ? clock(d) : clock(t) + " / " + clock(d);
    track.setAttribute("aria-valuemax", Math.round(d));
    track.setAttribute("aria-valuenow", Math.round(t));
    track.setAttribute("aria-valuetext", clock(t));
  };
  const loop = () => { if (!dragging) paint(audio.currentTime); raf = requestAnimationFrame(loop); };
  const seekTo = x => {
    const r = track.getBoundingClientRect();
    const t = Math.max(0, Math.min(1, (x - r.left) / r.width)) * (audio.duration || 0);
    paint(t);
    return t;
  };

  audio.addEventListener("loadedmetadata", () => paint(0));
  audio.addEventListener("play", () => {
    document.querySelectorAll(".player audio").forEach(a => a !== audio && a.pause());
    root.classList.add("playing"); btn.setAttribute("aria-label", "Pause"); raf = requestAnimationFrame(loop);
  });
  audio.addEventListener("pause", () => {
    root.classList.remove("playing"); btn.setAttribute("aria-label", "Play"); cancelAnimationFrame(raf); paint(audio.currentTime);
  });
  audio.addEventListener("ended", () => { audio.currentTime = 0; paint(0); });
  btn.addEventListener("click", () => audio.paused ? audio.play() : audio.pause());

  track.addEventListener("pointerdown", e => {
    if (!audio.duration) return;
    dragging = true; track.setPointerCapture(e.pointerId); seekTo(e.clientX);
  });
  track.addEventListener("pointermove", e => { if (dragging) seekTo(e.clientX); });
  const release = e => { if (!dragging) return; dragging = false; audio.currentTime = seekTo(e.clientX); };
  track.addEventListener("pointerup", release);
  track.addEventListener("pointercancel", () => { dragging = false; });
  track.addEventListener("keydown", e => {
    const step = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
    if (!step || !audio.duration) return;
    e.preventDefault();
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + step));
    paint(audio.currentTime);
  });
  if (audio.readyState >= 1) paint(0);
}

function route() {
  let [slug, sub] = location.hash.slice(1).split("/");
  if (ALIASES[slug]) { slug = ALIASES[slug]; history.replaceState(null, "", "#" + slug + (sub ? "/" + sub : "")); }
  const p = POSTS.find(x => x.slug === slug);
  const wasReading = !$("reader").hidden;
  const leftHash = readingHash;
  if (!p) document.querySelectorAll(".player audio").forEach(a => a.pause());
  $("home").hidden = !!p;
  $("reader").hidden = !p;
  document.title = p ? p.title + " · My English Journey" : "My English Journey";
  readingHash = p ? location.hash : null;

  if (p) {
    renderPost(p);
    // Si se abrió una evidencia que no es la primera, el lector va directo a ella
    const ev = sub > 0 && $("post").querySelectorAll(".evidence")[sub];
    if (ev) ev.scrollIntoView({ block: "start", behavior: "instant" });
    else window.scrollTo({ top: 0, behavior: "instant" });
    if (reduced()) {
      $("reader").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: "ease" });
    } else if (wasReading) {
      // Entre entradas: fundido con un poco de desenfoque para que se lea como un solo cambio
      $("post").animate([{ opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0)" }], { duration: 220, easing: EASE });
    } else {
      // Desde un archivo: la ventana nace desde donde se tocó
      const r = $("reader").getBoundingClientRect();
      if (lastCard) $("reader").style.transformOrigin = `${lastCard.x - r.left}px ${lastCard.y - (r.top + scrollY)}px`;
      $("reader").animate([{ opacity: 0, transform: "scale(.94)" }, { opacity: 1, transform: "none" }], { duration: 280, easing: EASE });
    }
    lastCard = null;
  } else {
    if (wasReading) {
      $("home").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: "ease" });
      // Se vuelve por el mismo camino: al archivo que se estaba leyendo, en la misma carpeta del Finder
      const file = (slug === "posts" || slug === "") && leftHash && $("fd-body").querySelector(`a[href="${leftHash}"]`);
      if (file) {
        requestAnimationFrame(() => {
          file.scrollIntoView({ block: "center", behavior: "instant" });
          if (!reduced()) file.animate(
            [{ transform: "scale(1.08)", opacity: .4 }, { transform: "none", opacity: 1 }],
            { duration: 260, easing: EASE }
          );
        });
        return;
      }
    }
    const el = slug && document.getElementById(slug);
    if (el) requestAnimationFrame(() => el.scrollIntoView({ behavior: wasReading || reduced() ? "instant" : "smooth" }));
  }
}

$("fd-body").addEventListener("click", e => {
  const folder = e.target.closest("[data-folder]");
  if (folder) return go(folder.dataset.folder);
  const row = e.target.closest("[data-toggle]");
  if (row) {
    const id = row.dataset.toggle;
    const opening = !fd.open.has(id);
    opening ? fd.open.add(id) : fd.open.delete(id);
    renderFinder(0, opening ? id : null);
    $("fd-body").querySelector(`[data-toggle="${id}"]`).focus();
    return;
  }
  const file = e.target.closest("a");
  if (!file) return;
  const r = file.getBoundingClientRect();
  lastCard = { x: r.left + r.width / 2, y: r.top + scrollY + r.height / 2 };
});
$("fd-nav").addEventListener("click", e => {
  const b = e.target.closest("[data-loc]");
  if (!b) return;
  go(b.dataset.loc);
  b.scrollIntoView({ inline: "nearest", block: "nearest", behavior: reduced() ? "instant" : "smooth" });
});
$("fd-crumbs").addEventListener("click", e => {
  const b = e.target.closest("[data-loc]");
  if (b && b.dataset.loc && !b.hasAttribute("aria-current")) go(b.dataset.loc);
});
$("fd-back").addEventListener("click", () => step(fd.back, fd.fwd, -1));
$("fd-fwd").addEventListener("click", () => step(fd.fwd, fd.back, 1));
$("fd-views").addEventListener("click", e => {
  const b = e.target.closest("[data-view]");
  if (!b || b.dataset.view === fdView) return;
  fdView = b.dataset.view;
  try { localStorage.setItem("fd-view", fdView); } catch {}
  renderFinder(0);
  if (!reduced()) $("fd-body").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "ease" });
});
$("fd-q").addEventListener("input", e => { fd.q = e.target.value; renderFinder(0); });
$("fd-q").addEventListener("keydown", e => { if (e.key === "Escape" && fd.q) { e.target.value = fd.q = ""; renderFinder(0); } });
$("back").addEventListener("click", () => { location.hash = "posts"; });
$("copy-email").addEventListener("click", async e => {
  try { await navigator.clipboard.writeText(SITE.email); e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy", 1600); }
  catch { const r = document.createRange(); r.selectNodeContents($("email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
});
window.addEventListener("hashchange", route);

renderSite();
renderFinder();
route();
</script>
</body>
</html>
